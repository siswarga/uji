<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedang Dalam Perbaikan - SI-GAS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    @keyframes typeL {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px) rotate(-1.5deg); }
    }
    @keyframes typeR {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px) rotate(1.5deg); }
    }
    @keyframes steamAnim {
      0% { opacity: 0.1; transform: translateY(0px) scaleX(0.8); }
      50% { opacity: 0.7; transform: translateY(-8px) scaleX(1.15); }
      100% { opacity: 0; transform: translateY(-16px) scaleX(1.4); }
    }
    @keyframes codeScrollAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-45px); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 10px rgba(6,182,212,0.4)); }
      50% { opacity: 0.75; filter: drop-shadow(0 0 22px rgba(249,115,22,0.5)); }
    }
    @keyframes floatTag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .anim-l-hand { animation: typeL 0.38s ease-in-out infinite; transform-origin: 200px 185px; }
    .anim-r-hand { animation: typeR 0.42s ease-in-out infinite 0.12s; transform-origin: 300px 185px; }
    .anim-steam-1 { animation: steamAnim 2.4s ease-out infinite; }
    .anim-steam-2 { animation: steamAnim 2.8s ease-out infinite 0.8s; }
    .anim-glow { animation: glowPulse 4s ease-in-out infinite; }
    .anim-code { animation: codeScrollAnim 3.2s linear infinite; }
    .anim-tag-float { animation: floatTag 3.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-black">

  <div class="w-full max-w-2xl bg-gradient-to-b from-[#0f172a] to-[#090d16] border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden text-center space-y-6">
    
    <!-- Glowing Blur Effect -->
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-80 h-80 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Badge Header Resmi SI-GAS -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900 border border-slate-700/80 text-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span class="font-bold text-slate-300 tracking-wider uppercase">Sistem Informasi Warga & Keamanan</span>
    </div>

    <!-- Ilustrasi Animasi Programmer Hidup -->
    <div class="relative mx-auto w-full max-w-[380px] h-[210px] sm:h-[240px] flex items-center justify-center">
      <svg viewBox="0 0 500 300" class="w-full h-full drop-shadow-[0_15px_30px_rgba(6,182,212,0.2)]" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="screenBeamM" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="screenClipM">
            <rect x="180" y="112" width="140" height="82" rx="4" />
          </clipPath>
          <linearGradient id="hoodieM" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
          <linearGradient id="skinM" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fed7aa"/>
            <stop offset="100%" stop-color="#fba863"/>
          </linearGradient>
        </defs>

        <!-- Ambient Cone -->
        <polygon points="180,112 320,112 390,260 110,260" fill="url(#screenBeamM)" class="anim-glow" pointer-events="none"/>

        <!-- Floating Tags -->
        <g class="anim-tag-float font-mono text-[11px] font-bold">
          <rect x="55" y="60" width="54" height="24" rx="6" fill="#0d1320" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" />
          <text x="67" y="76" fill="#22d3ee">&lt; / &gt;</text>
        </g>
        <g class="anim-tag-float font-mono text-[10px] font-bold" style="animation-delay: 0.6s;">
          <rect x="385" y="50" width="62" height="24" rx="6" fill="#0d1320" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.4" />
          <text x="395" y="66" fill="#fb923c">{ SI-GAS }</text>
        </g>

        <!-- Meja Kerja -->
        <rect x="50" y="248" width="400" height="12" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

        <!-- Cangkir Kopi & Uap -->
        <g>
          <ellipse cx="105" cy="248" rx="14" ry="4" fill="#334155"/>
          <rect x="94" y="226" width="22" height="20" rx="4" fill="#ea580c" stroke="#f97316" stroke-width="1"/>
          <path d="M116 230 C122 230 122 242 116 242" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="anim-steam-1" d="M102 222 Q105 214 102 206" stroke="#fdba74" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path class="anim-steam-2" d="M108 222 Q105 212 109 204" stroke="#fdba74" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Karakter Programmer -->
        <g>
          <path d="M210 248 L218 140 C218 128 282 128 282 140 L290 248 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
          <rect x="230" y="115" width="40" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <path d="M205 248 C205 200 220 170 250 170 C280 170 295 200 295 248 Z" fill="url(#hoodieM)" stroke="#334155" stroke-width="1.5"/>
          <rect x="242" y="152" width="16" height="22" rx="3" fill="url(#skinM)" />
          <circle cx="250" cy="142" r="22" fill="#1e293b" />
          <path d="M232 142 C232 126 268 126 268 142 C268 152 232 152 232 142 Z" fill="#0f172a"/>
          <path d="M228 142 C228 123 272 123 272 142" stroke="#f97316" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <rect x="225" y="137" width="7" height="12" rx="3" fill="#06b6d4"/>
          <rect x="268" y="137" width="7" height="12" rx="3" fill="#06b6d4"/>

          <!-- Tangan Bergerak Ngetik -->
          <g class="anim-l-hand">
            <path d="M216 205 Q225 228 245 233" stroke="url(#skinM)" stroke-width="8" stroke-linecap="round" fill="none"/>
            <ellipse cx="248" cy="234" rx="5" ry="3.5" fill="url(#skinM)"/>
          </g>
          <g class="anim-r-hand">
            <path d="M284 205 Q275 228 255 233" stroke="url(#skinM)" stroke-width="8" stroke-linecap="round" fill="none"/>
            <ellipse cx="252" cy="234" rx="5" ry="3.5" fill="url(#skinM)"/>
          </g>
        </g>

        <!-- Laptop & Code Scrolling -->
        <g>
          <path d="M165 242 L335 242 L320 234 L180 234 Z" fill="#334155" stroke="#475569" stroke-width="1.2"/>
          <rect x="195" y="236" width="110" height="4" rx="1.5" fill="#22d3ee" opacity="0.8" class="animate-pulse"/>
          <rect x="175" y="105" width="150" height="96" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
          <rect x="175" y="105" width="150" height="13" rx="6" fill="#131b2e"/>
          <circle cx="185" cy="111.5" r="2.2" fill="#ef4444"/>
          <circle cx="192" cy="111.5" r="2.2" fill="#f59e0b"/>
          <circle cx="199" cy="111.5" r="2.2" fill="#10b981"/>
          <text x="215" y="114" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="7" font-weight="bold">SI-GAS_Engine.gs</text>
          <rect x="180" y="118" width="140" height="78" fill="#070a10"/>

          <g clip-path="url(#screenClipM)">
            <g class="anim-code">
              <rect x="186" y="124" width="30" height="3" rx="1.5" fill="#f43f5e" />
              <rect x="220" y="124" width="45" height="3" rx="1.5" fill="#38bdf8" />
              <rect x="270" y="124" width="22" height="3" rx="1.5" fill="#fcd34d" />
              <rect x="192" y="132" width="55" height="3" rx="1.5" fill="#34d399" />
              <rect x="252" y="132" width="35" height="3" rx="1.5" fill="#a78bfa" />
              <rect x="192" y="140" width="70" height="3" rx="1.5" fill="#38bdf8" />
              <rect x="266" y="140" width="28" height="3" rx="1.5" fill="#fb923c" />
              <rect x="186" y="148" width="40" height="3" rx="1.5" fill="#f43f5e" />
              <rect x="230" y="148" width="50" height="3" rx="1.5" fill="#34d399" />
              <rect x="186" y="169" width="30" height="3" rx="1.5" fill="#f43f5e" />
              <rect x="220" y="169" width="45" height="3" rx="1.5" fill="#38bdf8" />
              <rect x="192" y="177" width="55" height="3" rx="1.5" fill="#34d399" />
            </g>
          </g>
          <rect x="230" y="201" width="40" height="4" rx="2" fill="#1e293b"/>
        </g>
      </svg>
    </div>

    <!-- Title & Penjelasan -->
    <div class="space-y-2.5">
      <h1 class="text-2xl sm:text-3xl font-black text-white leading-tight">
        Mesin Tempur<br>
        <span class="bg-gradient-to-r from-amber-400 via-orange-400 to-cyan-400 bg-clip-text text-transparent">
          Sedang Dalam Perbaikan Berkala
        </span>
      </h1>
      <p class="text-xs sm:text-sm text-slate-300 max-w-md mx-auto leading-relaxed">
        Sistem sedang dioptimalkan untuk meningkatkan performa & kestabilan layanan warga. Seluruh data kependudukan tetap aman di cloud.
      </p>
    </div>

    <!-- Live Countdown -->
    <div class="grid grid-cols-4 gap-2 max-w-sm mx-auto">
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5">
        <span id="cdDays" class="text-xl sm:text-2xl font-black text-amber-400 font-mono block">00</span>
        <span class="text-[9px] text-slate-400 font-bold uppercase">Hari</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5">
        <span id="cdHours" class="text-xl sm:text-2xl font-black text-amber-400 font-mono block">02</span>
        <span class="text-[9px] text-slate-400 font-bold uppercase">Jam</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5">
        <span id="cdMinutes" class="text-xl sm:text-2xl font-black text-amber-400 font-mono block">30</span>
        <span class="text-[9px] text-slate-400 font-bold uppercase">Menit</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5">
        <span id="cdSeconds" class="text-xl sm:text-2xl font-black text-cyan-400 font-mono block">00</span>
        <span class="text-[9px] text-slate-400 font-bold uppercase">Detik</span>
      </div>
    </div>

    <!-- Action Links -->
    <div class="pt-3 border-t border-slate-800 flex flex-wrap items-center justify-center gap-3">
      <button onclick="handleMuatUlang()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center gap-2 transition">
        <i class="fa-solid fa-arrow-rotate-right text-cyan-400"></i>
        <span>Muat Ulang Halaman</span>
      </button>
    </div>
  </div>

  <script>
    // Arahkan kembali ke portal utama saat klik Muat Ulang
    function handleMuatUlang() {
      window.location.href = 'https://siswarga.github.io/uji/';
    }

    const STORAGE_KEY = 'sigas_maintenance_target_time_v2';
    const DURATION_MS = (2 * 60 + 30) * 60 * 1000; // 2 Jam 30 Menit

    let savedTarget = localStorage.getItem(STORAGE_KEY);
    let targetTime = savedTarget ? parseInt(savedTarget, 10) : null;
    const nowInit = new Date().getTime();

    // Jika belum tersimpan atau waktu di cache sudah lewat, buat target baru
    if (!targetTime || targetTime <= nowInit) {
      targetTime = nowInit + DURATION_MS;
      localStorage.setItem(STORAGE_KEY, targetTime);
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetTime - now;

      if (diff <= 0) {
        document.getElementById('cdDays').textContent = '00';
        document.getElementById('cdHours').textContent = '00';
        document.getElementById('cdMinutes').textContent = '00';
        document.getElementById('cdSeconds').textContent = '00';
        return;
      }

      // Perhitungan sinkron Hari, Jam, Menit, Detik
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cdDays').textContent = String(days).padStart(2, '0');
      document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cdMinutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('cdSeconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>

// Pengganti google.script.run untuk GET (Ambil Data)
async function apiGet(action, params = {}) {
  try {
    let url = new URL(BACKEND_URL);
    url.searchParams.append('action', action);
    for (let key in params) {
      url.searchParams.append(key, params[key]);
    }
    let response = await fetch(url);
    return await response.json();
  } catch (error) {
    console.error("API GET Error:", error);
    return { success: false, message: error.message };
  }
}

// Pengganti google.script.run untuk POST (Kirim/Simpan Data)
async function apiPost(action, token, data = {}) {
  try {
    let response = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Mencegah preflight CORS di GAS
      body: JSON.stringify({ action: action, token: token, data: data })
    });
    return await response.json();
  } catch (error) {
    console.error("API POST Error:", error);
    return { success: false, message: error.message };
  }
}

           function startMasjidClock() {
          // Hentikan interval yang lama jika sebelumnya sudah berjalan
          if (typeof intervalMasjid !== 'undefined' && intervalMasjid) {
        clearInterval(intervalMasjid);
          }
          
          // Pasang kembali setInterval untuk jam digital & hitung mundur sholat (tiap 1 detik)
          intervalMasjid = setInterval(() => {
        let now = new Date();
        
        // Update Jam & Tanggal Masehi
        let clockEl = document.getElementById('masjid-clock');
        let dateEl = document.getElementById('masjid-date-masehi');
        if(clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', {hour12: false});
        if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
        
        // Update Hitung Mundur Waktu Sholat
        if(typeof apiSholatTimes !== 'undefined' && apiSholatTimes) {
          let currentMinutes = now.getHours() * 60 + now.getMinutes();
          let currentSeconds = now.getSeconds();
          let nextPrayer = null;
          let minDiff = 9999;
          
          for(const [name, time] of Object.entries(apiSholatTimes)) {
            let parts = time.split(':');
            let prayerMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            let diff = prayerMinutes - currentMinutes;
            
            // Peringatan adzan pas masuk waktunya
            if(diff === 0 && currentSeconds === 0) {
               if(typeof triggerAdhanAlert === 'function') triggerAdhanAlert(name);
            }
            
            if(diff > 0 && diff < minDiff) {
              minDiff = diff;
              nextPrayer = { name: name, time: time };
            }
          }
          
          let nextNameEl = document.getElementById('masjid-next-prayer-name');
          let cdEl = document.getElementById('masjid-countdown-prayer');
          
          if(nextPrayer) {
            if(nextNameEl) nextNameEl.innerText = 'Menuju ' + nextPrayer.name;
            
            let targetTime = new Date();
            let pParts = nextPrayer.time.split(':');
            targetTime.setHours(parseInt(pParts[0]), parseInt(pParts[1]), 0, 0);
            
            let diffMs = targetTime.getTime() - now.getTime();
            if(diffMs > 0) {
               let sHours = Math.floor(diffMs / (1000 * 60 * 60));
               let sMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
               let sSecs = Math.floor((diffMs % (1000 * 60)) / 1000);
               
               if(cdEl) cdEl.innerText = '-' + String(sHours).padStart(2,'0') + ' : ' + String(sMins).padStart(2,'0') + ' : ' + String(sSecs).padStart(2,'0');
            }
          } else {
            if(nextNameEl) nextNameEl.innerText = "Menuju Subuh (Esok)";
            if(cdEl) cdEl.innerText = "- Menunggu pergantian hari -";
          }
        }
          }, 1000); // Berjalan setiap 1 detik khusus untuk jam masjid
        }

    function submitQrisBayar(e) {
      e.preventDefault();
    
      const kategoriVal = document.getElementById('qris_kategori').value;
      let namaVal = '';
      let namaKKVal = '-';
      const checkedBulan = [];
      const tahunVal = new Date().getFullYear();
    
      // 1. Validasi Input Berdasarkan Kategori Transaksi
      if (kategoriVal === 'Iuran Warga') {
        if (!qrisDataWargaTerverifikasi) {
          return Swal.fire('Peringatan', 'Silakan masukkan dan verifikasi Kode Unik terlebih dahulu!', 'warning');
        }
        namaKKVal = qrisDataWargaTerverifikasi.namaKK;
        namaVal = '-';
    
        document.querySelectorAll('.qris-chk-bulan:checked:not([disabled])').forEach(cb => {
          checkedBulan.push(cb.value);
        });
    
        if (checkedBulan.length === 0) {
          return Swal.fire('Peringatan', 'Pilih minimal 1 bulan iuran yang ingin dibayar!', 'warning');
        }
      } else if (kategoriVal === 'Jimpitan') {
        namaVal = 'Warga (Kolektif)';
        namaKKVal = 'Warga (Kolektif)';
      } else {
        namaVal = document.getElementById('qris_select_nama').value;
        if (namaVal === 'UMUM') {
          namaVal = document.getElementById('qris_nama_manual').value;
        }
      }
    
      // 2. Siapkan Objek Payload Pembayaran
      const payload = {
        tipe: document.getElementById('qris_tipe_tujuan').value,
    	qrisIndex: typeof activeQrisIndex !== 'undefined' ? activeQrisIndex : 1,
        nama: namaVal,
        namaKK: namaKKVal,
        kategori: kategoriVal,
        nominal: document.getElementById('qris_nominal').value,
        bulan: checkedBulan.join(', ') || '-',
        tahun: tahunVal,
        keterangan: document.getElementById('qris_keterangan').value || 'Pembayaran via QRIS Online'
      };
    
      // 3. Kunci Tombol Pengiriman
      const btn = document.getElementById('btn-kirim-qris');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Mengirim...';
      }
    
      // 4. Kirim Data ke Backend Google Apps Script
      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = 'Konfirmasi & Kirim Pembayaran';
          }
    
          // Tutup modal form pembayaran QRIS
          const modalEl = document.getElementById('modalQrisBayar');
          if (modalEl) {
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (modalInstance) modalInstance.hide();
          }
    
          if (res && res.success) {
            const namaAplikasi = (res && res.namaAplikasi) 
                                       ? res.namaAplikasi 
                                       : (window.appSettings && appSettings['nama_aplikasi']) 
                                           ? appSettings['nama_aplikasi'] 
                                           : 'SI-GAS';
                                           
            const namaKomplek = (res && res.namaKomplek) 
                                        ? res.namaKomplek 
                                        : (window.appSettings && appSettings['nama_komplek']) 
                                            ? appSettings['nama_komplek'] 
                                            : 'Komplek Warga';
    
            const namaApp = namaAplikasi;
    
            // Cek Saklar Mode Otomatis vs Manual
            if (res.isAutoSent) {
              // Jika mode otomatis AKTIF: Pesan langsung terkirim dari server tanpa buka WhatsApp
              Swal.fire({
                icon: 'success',
                title: 'Berhasil Diajukan!',
                text: 'Data pembayaran telah tercatat dan notifikasi otomatis telah dikirim ke WhatsApp Pengurus.',
                timer: 2500,
                showConfirmButton: false
              });
            } else {
              // Jika mode manual (saklar MATI): Siapkan tautan wa.me untuk konfirmasi manual
              let waText = '';
              if (payload.kategori === 'Jimpitan') {
                const tglHariIni = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                waText = `Alhamdulillah Jimpitan Hari ini tanggal ${tglHariIni} sebesar ${formatRupiah(payload.nominal)}\n\n` +
                         `Terimakasih Kepada Seluruh Warga ${namaKomplek} atas partisipasinya, semoga dilipatgandakan oleh Allah SWT 🙏\n\n` +
                         `_Pesan otomatis dari Aplikasi ${namaApp}_`;
              } else {
                const jenisKasTeks = payload.tipe === 'kas_warga' ? 'Kas Warga / RT' : 'Kas Masjid Assalam';
                const bulanInfo = checkedBulan.length > 0 ? `📅 Bulan: *${payload.bulan}*\n` : '';
                const targetNama = (namaKKVal !== '-' && namaKKVal) ? namaKKVal : namaVal;
    
                waText = `*KONFIRMASI PEMBAYARAN QRIS*\n\n` +
                         `Halo Pengurus/Bendahara, saya ingin mengonfirmasi pembayaran:\n\n` +
                         `👤 Nama/KK: *${targetNama}*\n` +
                         `📂 Tujuan: *${jenisKasTeks}*\n` +
                         `🏷️ Kategori: *${payload.kategori}*\n` +
                         `${bulanInfo}💵 Nominal: *${formatRupiah(payload.nominal)}*\n` +
                         `📝 Keterangan: ${payload.keterangan}\n\n` +
                         `Mohon untuk dicek dan divalidasi di sistem ${namaAplikasi}. Terima kasih 🙏`;
              }
    
              let waLink = '';
              const targetAdminWa = res.adminWa || (window.appSettings && appSettings['wa_bendahara']) || '';

        // Fungsi Baru untuk Menjalankan Hitung Mundur Real-Time di Layar Login
        function startLoginCountdown(seconds) {
          const btn = document.querySelector('#form-login button[type="submit"]');
          const userIn = document.getElementById('username');
          const passIn = document.getElementById('password');
          
          // Kunci input agar tidak bisa diketik
          userIn.disabled = true;
          passIn.disabled = true;
          btn.disabled = true;
          
          // Tampilkan peringatan SweetAlert (hilang otomatis)
          Swal.fire({
        icon: 'warning',
        title: 'Akun Terblokir Sementara',
        text: 'Terlalu banyak percobaan gagal. Silakan tunggu hingga waktu habis.',
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 4000
          });
          
          // Hentikan timer sebelumnya jika ada (mencegah bug double speed)
          if(loginCountdownTimer) clearInterval(loginCountdownTimer);
          
          loginCountdownTimer = setInterval(() => {
         if(seconds <= 0) {
            // Waktu Habis -> Buka kembali inputan
            clearInterval(loginCountdownTimer);
            btn.disabled = false;
            btn.innerHTML = 'Masuk Panel';
            userIn.disabled = false;
            passIn.disabled = false;
            
            Swal.fire({
              icon: 'info',
              title: 'Blokir Dibuka',
              text: 'Anda dapat mencoba login kembali. Jika gagal lagi, akun akan dikunci permanen!',
              confirmButtonColor: '#198754'
            });
         } else {
            // Proses hitung menit dan detik
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            let timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;
            
            // Ubah teks tombol menjadi penghitung mundur merah
            btn.innerHTML = `<i class="fas fa-lock"></i> Terblokir (${timeStr})`;
            btn.classList.replace('btn-primary', 'btn-danger'); // Ubah warna jadi merah
            
            seconds--;
         }
          }, 1000); // Berjalan setiap 1000 ms (1 Detik)
        }

    function updateNotificationBadges(counts) {

      const bKgt = document.getElementById('badge-topbar-kegiatan');
      const dKgt = document.getElementById('dash-notif-kegiatan');
      if (bKgt) {

      }
      if (dKgt) dKgt.innerText = kgtVal;
    
      // B. Pengaduan Baru
      const aduVal = parseInt(counts.pengaduan) || 0;
      const bAdu = document.getElementById('badge-topbar-pengaduan');
      const dAdu = document.getElementById('dash-notif-pengaduan');

      }

    function handleLogin(e) { 
      e.preventDefault(); 
      const u = document.getElementById('username');
      const p = document.getElementById('password');
      const btn = document.querySelector('#form-login button[type="submit"]');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';
      
      google.script.run.withSuccessHandler(res => {
        btn.innerHTML = 'Masuk Panel';
        btn.disabled = false;
    
        if(res.success) {
          localStorage.setItem('sigas_token', res.data.token);
          currentUser = res.data.user;
    
          // KUNCI 1: Login baru selalu diarahkan ke dashboard
          localStorage.setItem('sigas_active_menu', 'menu-dashboard');
    
          u.value = '';
          p.value = '';
    
          Swal.fire({icon:'success', title:'Login Berhasil', timer:1000, showConfirmButton:false});
          showApp();
        } else { 
          if (res.isBlocked && res.remainingSecs > 0) {
            startLoginCountdown(res.remainingSecs);

          }
        }
      }).withFailureHandler(err => {

        } else {

        function renderTableWarga(){ 
        const cat = document.getElementById('filter-kategori-warga').value;
        const s = document.getElementById('search-warga').value.toLowerCase(); 
        const srt = document.getElementById('sort-warga').value; 
        
        // Logika penyaringan data berdasarkan pilihan dropdown
        let f = dataWargaGlobal.filter(w => {
            let isNonDomisili = w.alamatTinggal && w.alamatKtp && w.alamatTinggal.trim() !== w.alamatKtp.trim();
        
            if (cat === 'nama') return w.nama.toLowerCase().includes(s);
            if (cat === 'nik') return w.nik.toLowerCase().includes(s);
            if (cat === 'kk') return w.kk.toLowerCase().includes(s);
            if (cat === 'alamat') return w.alamatTinggal.toLowerCase().includes(s);
            if (cat === 'kontrak') return w.statusTinggal && w.statusTinggal.toLowerCase() === 'kontrak';
            if (cat === 'domisili') return !isNonDomisili;
            if (cat === 'non_domisili') return isNonDomisili;
            
            // Default 'all' (Pencarian global)
            return w.nama.toLowerCase().includes(s) || 
                   w.nik.toLowerCase().includes(s) || 
                   w.kk.toLowerCase().includes(s) || 
                   w.alamatTinggal.toLowerCase().includes(s) || 
                   (w.blok && w.blok.toLowerCase().includes(s));
        }); 
        
        if(srt === 'name_asc') f.sort((a,b) => a.nama.localeCompare(b.nama)); 
        else if(srt === 'name_desc') f.sort((a,b) => b.nama.localeCompare(a.nama)); 
        
        // --- KELOMPOKKAN BERDASARKAN NO KK ---
        let familyMap = {};
        f.forEach(w => {
            let kkKey = w.kk && w.kk !== '-' ? w.kk : 'Tanpa_KK_' + w.id;
            if (!familyMap[kkKey]) {
                let isNonDomisili = w.alamatTinggal && w.alamatKtp && w.alamatTinggal.trim() !== w.alamatKtp.trim();
                
                familyMap[kkKey] = {
                    kk: w.kk || '-',
                    alamat: w.alamatTinggal || '-',
                    statusTinggal: w.statusTinggal || 'Tetap',
                    isNonDomisili: isNonDomisili,
                    anggota: []
                };
            }
            familyMap[kkKey].anggota.push(w);
        });
        
        let families = Object.values(familyMap);
        
        const st = (currentPage - 1) * dataPerPage; 
        const pgFamilies = families.slice(st, st + dataPerPage); 
        
        const tb = document.getElementById('tbody-warga'); 
        tb.innerHTML = ''; 
        
        if(pgFamilies.length === 0){ 
            tb.innerHTML = '<tr><td colspan="10" class="text-center py-3">Tidak ada data keluarga ditemukan</td></tr>'; 
        } else {
            pgFamilies.forEach((fam) => {
                let badgeDomisili = fam.isNonDomisili 
                    ? `<span class="badge bg-danger ms-1">Non-Domisili</span>` 
                    : `<span class="badge bg-success ms-1">Domisili KTP</span>`;
        
                tb.innerHTML += `
                    <tr class="table-success bg-opacity-10">
                        <td colspan="10" class="fw-bold py-2">
                            <i class="fas fa-house-user text-success me-2"></i> 
                            No. KK: <span class="text-primary font-monospace">${fam.kk}</span> 
                            | Alamat: <span class="text-muted fw-normal">${fam.alamat}</span> 
                            ${badgeDomisili}
                            <span class="badge bg-success float-end">${fam.anggota.length} Anggota Keluarga</span>
                        </td>
                    </tr>`;
        
                fam.anggota.forEach((m) => {
                    let badgeStatus = m.statusAktif === 'Aktif' ? `<span class="badge bg-success">Aktif</span>` : `<span class="badge bg-secondary">${m.statusAktif}</span>`;
                    let badgeKepala = m.statusKeluarga === 'Kepala Keluarga' ? `<span class="badge bg-primary me-1">KK</span>` : `<span class="badge bg-light text-dark border me-1">${m.statusKeluarga}</span>`;
                    
                    tb.innerHTML += `
                        <tr>
                            <td class="ps-4"><div class="fw-bold">${badgeKepala} ${m.nama}</div></td>
                            <td><span class="font-monospace text-secondary small">NIK: ${m.nik}</span></td>
                            <td>${m.jk}</td>
                            <td><small>${m.tempatLahir}, ${m.tglLahir}</small></td>
                            <td>${m.agama} <br><span class="badge bg-light text-dark border" style="font-size:0.7rem;">Gol: ${m.golDarah}</span></td>
                            <td><span class="badge bg-light text-primary border">${m.statusKeluarga}</span></td>
                            <td>${formatWA(m.noHp)}</td>
                            <td><small>${m.alamatTinggal}</small></td>
                            <td>${badgeStatus}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary mb-1" onclick="requestEditWarga('${m.id}')" title="Edit Data"><i class="fas fa-edit"></i></button> 
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteWarga('${m.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                });
            });
        } 
        
        document.getElementById('warga-info').innerText = `Menampilkan ${families.length > 0 ? st+1 : 0} - ${st+pgFamilies.length} dari ${families.length} Keluarga`; 
        document.getElementById('warga-pagination').innerHTML = `${currentPage > 1 ? `<button class="btn btn-sm btn-outline-secondary" onclick="currentPage--; renderTableWarga()">Prev</button>` : ''} ${currentPage < Math.ceil(families.length / dataPerPage) ? `<button class="btn btn-sm btn-outline-secondary" onclick="currentPage++; renderTableWarga()">Next</button>` : ''}`; 
        }

        // SIMPAN / UPDATE DATA WARGA OLEH ADMIN

        function saveWargaData(e) {
          e.preventDefault();
        
          // 1. Ambil nilai dasar yang butuh divalidasi
          let kkVal = document.getElementById('warga_kk').value;
          let nikVal = document.getElementById('warga_nik').value;
          let blokVal = document.getElementById('warga_blok').value;
        
          // 2. Validasi Ketat: Cek 16 Digit & 6 Karakter
          if (kkVal.length !== 16) {
        return Swal.fire('Peringatan', 'Nomor KK harus persis 16 digit angka!', 'warning');
          }
          if (nikVal.length !== 16) {
        return Swal.fire('Peringatan', 'NIK harus persis 16 digit angka!', 'warning');
          }
          if (blokVal.length !== 6) {
        return Swal.fire('Peringatan', 'Kode Unik (Blok) harus persis 6 karakter!', 'warning');
          }
        
          // 3. Kunci tombol agar tidak di-klik berulang (Double Submit)
          const b = document.getElementById('btn-save-warga');
          b.disabled = true;
          b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        
          // 4. Susun Payload Data
          const p = {
        nama: document.getElementById('warga_nama').value,
        kk: kkVal,
        nik: nikVal,
        noHp: document.getElementById('warga_hp').value,
        jk: document.getElementById('warga_jk').value,
        golDarah: document.getElementById('warga_gol').value,
        agama: document.getElementById('warga_agama').value,
        blok: blokVal.toUpperCase(), // Paksa huruf kapital saat masuk ke database
        tempatLahir: document.getElementById('warga_tempatLahir').value,
        tglLahir: document.getElementById('warga_tglLahir').value,
        statusTinggal: document.getElementById('warga_statusTinggal').value,
        tglMasuk: document.getElementById('warga_tglMasuk').value,
        tglKeluar: document.getElementById('warga_tglKeluar').value,
        statusPernikahan: document.getElementById('warga_nikah').value,
        statusKeluarga: document.getElementById('warga_statusKeluarga').value,
        alamatKtp: document.getElementById('warga_alamatKtp').value,
        alamatTinggal: document.getElementById('warga_alamatTinggal').value,
        statusAktif: document.getElementById('warga_aktif').value,
        keterangan: document.getElementById('warga_ket').value
          };
        
          const id = document.getElementById('warga_id').value;
        
          // 5. Eksekusi Berdasarkan Mode (Tambah Baru vs Update Data Lama)
          if (id === '') {
        // Mode Tambah Baru
        google.script.run.withSuccessHandler(r => {
          b.disabled = false;
          b.innerHTML = 'Simpan';
          if (r.success) {
            bootstrap.Modal.getInstance(document.getElementById('modalWarga')).hide();
            Swal.fire({icon: 'success', title: 'Berhasil', showConfirmButton: false, timer: 1200});
            loadDataWarga();
          } else {
            Swal.fire('Error', r.message, 'error');
          }
        }).saveWarga(localStorage.getItem('sigas_token'), p);
        
          } else {
        // Mode Update / Edit
        google.script.run.withSuccessHandler(r => {
          b.disabled = false;
          b.innerHTML = 'Simpan';
          if (r.success) {
            bootstrap.Modal.getInstance(document.getElementById('modalWarga')).hide();
            Swal.fire({icon: 'success', title: 'Berhasil Diperbarui', showConfirmButton: false, timer: 1200});
            loadDataWarga();
          } else {
            Swal.fire('Error', r.message, 'error');
          }
        }).updateWarga(localStorage.getItem('sigas_token'), id, p);
          }
        }

        const groupedDates = Array.from(gd.values());
        
        // Helper untuk mengenali dan menghitung selisih tanggal kalender
        function parseDate(str) {
            if (str.includes('/')) {
                let p = str.split('/'); // Format DD/MM/YYYY
                return new Date(p[2], p[1] - 1, p[0]);
            } else {
                return new Date(str); // Format YYYY-MM-DD
            }
        }
        
        // Urutkan jadwal dari yang paling awal
        groupedDates.sort((a, b) => parseDate(a.tanggal) - parseDate(b.tanggal));
        
        // 2. Memecah jadwal berdasarkan JARAK KALENDER (per 7 hari), BUKAN berdasarkan jumlah baris data
        let chunks = [];
        if (groupedDates.length > 0) {
            let startDate = parseDate(groupedDates[0].tanggal);
            
            groupedDates.forEach(g => {
                let d = parseDate(g.tanggal);
                let diffTime = d.getTime() - startDate.getTime();
                let diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
                
                // Menentukan index minggu berdasarkan jarak hari dari tanggal pertama
                let weekIdx = Math.floor(diffDays / 7);
                
                if (!chunks[weekIdx]) chunks[weekIdx] = [];
                chunks[weekIdx].push(g);
            });
        }
        
        // Bersihkan array dari index yang kosong (jika ada jeda minggu yang terlewat)
        chunks = chunks.filter(c => c !== undefined && c.length > 0);
        
        // 3. Membuat List Opsi untuk Popup
        let optionsHtml = `<option value="all">Keseluruhan Jadwal (${groupedDates.length} Hari Aktif)</option>`;
        
        if (chunks.length > 1) {
            chunks.forEach((chunk, index) => {
                let tglAwal = chunk[0].tanggal;
                let tglAkhir = chunk[chunk.length - 1].tanggal;
                
                // Jika jadwal tipe Mingguan (Hanya ada 1 hari di rentang 7 hari tersebut)
                let textTanggal = (tglAwal === tglAkhir) ? tglAwal : `${tglAwal} s/d ${tglAkhir}`;
                
                optionsHtml += `<option value="${index}">Hanya Minggu ${index + 1} (${textTanggal})</option>`;
            });
        }
        
        // Menampilkan Popup SweetAlert
        Swal.fire({
            title: 'Export JPG Jadwal Ronda',
            html: `
                <div class="text-start mt-3">
                    <label class="form-label fw-bold">Pilih Rentang Waktu yang Ingin Dicetak:</label>
                    <select id="swal-export-select" class="form-select border-success">
                        ${optionsHtml}
                    </select>
                </div>
            `,
            icon: 'info',
            showCancelButton: true,
            confirmButtonColor: '#198754',
            confirmButtonText: '<i class="fas fa-download me-1"></i> Download JPG',
            cancelButtonText: 'Batal',
            preConfirm: () => {
                return document.getElementById('swal-export-select').value;
            }
        }).then((result) => {
            if (result.isConfirmed) {
                showLoading();
                let selected = result.value;
                
                if (selected === 'all') {
                    generateAndDownloadJPG(groupedDates, 'Jadwal_Ronda_Keseluruhan', 'Jadwal Ronda (Keseluruhan)').then(() => hideLoading());
                } else {
                    let idx = parseInt(selected);
                    let selectedChunk = chunks[idx];
                    generateAndDownloadJPG(selectedChunk, `Jadwal_Ronda_Minggu_${idx + 1}`, `Jadwal Ronda - Minggu ${idx + 1}`).then(() => hideLoading());
                }
            }
        });
        }

        	function renderTableTamu() {
        // Ambil input pencarian dari halaman utama ATAU dari tab Satpam
        let searchInput = document.getElementById('search-tamu') || document.getElementById('search-satpam-tamu');
        let search = searchInput ? searchInput.value.toLowerCase() : '';
          
        // Ambil nilai filter (jika ada)
        let filterEl = document.getElementById('filter-tamu');
        let filter = filterEl ? filterEl.value : 'All';
          
        let filtered = dataTamuGlobal.filter(t => {
            let matchSearch = t.nama.toLowerCase().includes(search) || t.plat.toLowerCase().includes(search) || t.tujuan.toLowerCase().includes(search);
            let matchFilter = filter === 'All' ? true : t.status === filter;
            return matchSearch && matchFilter;
        });
          
        // Render ke tabel utama (jika sedang dibuka)
        let tbodyMain = document.getElementById('tbody-tamu');
        if (tbodyMain) {
            populateTamuTable(tbodyMain, filtered);
        }
        
        // Render ke tabel tab Satpam (jika sedang dibuka)
        let tbodySatpam = document.getElementById('tbody-satpam-tamu');
        if (tbodySatpam) {
            populateTamuTable(tbodySatpam, filtered);

        function populateTamuTable(tbody, filteredData) {
        tbody.innerHTML = '';
        if(filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada riwayat tamu.</td></tr>`;
            return;
        }
          
        filteredData.forEach(t => {
            let statusBadge = t.status === 'Masuk' 
                ? `<span class="badge bg-warning text-dark"><i class="fas fa-sign-in-alt"></i> Masih di Dalam</span>` 
                : `<span class="badge bg-secondary"><i class="fas fa-sign-out-alt"></i> Keluar</span>`;
                
            let btnKeluar = t.status === 'Masuk' 
                ? `<button class="btn btn-sm btn-outline-danger fw-bold" onclick="checkoutTamu('${t.id}')">Catat Keluar</button>` 
                : `<span class="text-muted small"><i class="fas fa-check-circle text-success"></i> Selesai</span>`;
        
            tbody.innerHTML += `
              <tr>
                <td><div class="fw-bold text-success">${t.waktu_masuk}</div><small class="text-muted">Petugas: ${t.petugas}</small></td>
                <td><div class="fw-bold">${t.nama}</div><span class="badge bg-light text-dark border"><i class="fas fa-car-side"></i> ${t.plat || '-'}</span></td>
                <td><div class="text-primary fw-bold">${t.tujuan}</div><small class="text-muted">${t.keperluan}</small></td>
                <td><div class="fw-bold text-danger">${t.waktu_keluar}</div></td>
                <td>${statusBadge}</td>
                <td>${btnKeluar}</td>
              </tr>
            `;
        });
        }

          // Fungsi pembantu untuk mengubah format Date dari Google Sheets menjadi "HH:mm"
        function formatJamInput(val) {
          if (!val) return '';
          // Jika data dari backend terbaca sebagai objek/string tanggal
          const d = new Date(val);
          if (!isNaN(d.getTime())) {
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
          }
          // Jika sudah berupa string biasa (misal "19:00:00")
          return String(val).substring(0, 5);
        }

        function calculateIslamicHolidays(cYear, cMonth, cDay) {
          let daysToFitri = getHijriDiffDays(cMonth, cDay, 10, 1);
          let fEl = document.getElementById('cd-idul-fitri');
          if(fEl) fEl.innerText = daysToFitri === 0 ? 'HARI INI!' : (daysToFitri < 0 ? 'Telah Lewat' : daysToFitri + ' Hari Lagi');
          
          let daysToAdha = getHijriDiffDays(cMonth, cDay, 12, 10);
          let aEl = document.getElementById('cd-idul-adha');
          if(aEl) aEl.innerText = daysToAdha === 0 ? 'HARI INI!' : (daysToAdha < 0 ? 'Telah Lewat' : daysToAdha + ' Hari Lagi');
        
          let daysToMuharram = getHijriDiffDays(cMonth, cDay, 13, 1); 
          let mEl = document.getElementById('cd-muharram');
          if(mEl) mEl.innerText = daysToMuharram + ' Hari Lagi';
        }
        
        function getHijriDiffDays(m1, d1, m2, d2) {
          let currentTotalDays = (m1 * 29.5) + d1;
          let targetTotalDays = (m2 * 29.5) + d2;
          return Math.round(targetTotalDays - currentTotalDays);
        }

                confirmButtonColor: '#198754'
              });
            }).catch(() => {
              Swal.close();
              window.open("https://wa.me/?text=" + encodeURIComponent(text), '_blank');
            });
          }
        }, 'image/jpeg', 0.9);
      }).catch(err => {

        function savePengajian(token, p) {
          const session = verifySession(token);
          if (!isAuthorized(token, 'menu-dewan-masjid')) return { success: false, message: "Akses ditolak" };
          const ss = SpreadsheetApp.getActiveSpreadsheet();
          
          // 1. Simpan ke Database Dewan Masjid
          const sheet = ss.getSheetByName(SHEETS.JADWAL_PENGAJIAN);
          let id = "KJN-" + new Date().getTime();
          sheet.appendRow([id, p.tanggal, p.jam, p.pemateri, p.tema, p.lokasi, 'Akan Datang', new Date()]);
        
          // 2. OTOMATIS TAMBAHKAN KE JADWAL KEGIATAN UTAMA (DASHBOARD WARGA)
          const sheetKgt = ss.getSheetByName(SHEETS.JADWAL_KEGIATAN);
          if (sheetKgt) {
        const lastRowKgt = sheetKgt.getLastRow();
        let newIdNum = 1;
        if (lastRowKgt > 1) {
          let match = String(sheetKgt.getRange(lastRowKgt, 1).getValue()).match(/\d+$/);
          if (match) newIdNum = parseInt(match[0], 10) + 1;
        }
        let idKgt = "KGT-" + ("000000" + newIdNum).slice(-6);
        
        let tglObj = new Date(p.tanggal);
        let namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][tglObj.getDay()] || '-',
            deskripsiKajian = "Kajian Islam: " + p.tema + " (: " + p.pemateri + ")";
        
        // Format kolom: [ID Kegiatan, Tanggal, Hari, Waktu, Deskripsi, Lokasi, Status, Notifikasi, Created By, Created At, Updated At, Waktu Selesai, Sesi, Open Donasi, Tanggal Selesai]
        sheetKgt.appendRow([
          idKgt, p.tanggal, namaHari, p.jam, deskripsiKajian, p.lokasi || 'Masjid Komplek', 
          'Akan Datang', 'Belum Dikirim', session.data.nama, new Date(), new Date(),
          p.jam, 'Masjid', p.openDonasi || 'Tidak', p.tanggal
        ]);
          }
        
          recordHistory(session.data.nama, "Dewan Masjid", "Jadwal kajian & sinkronisasi kegiatan: " + p.tema);
          return { success: true, message: "Jadwal Pengajian berhasil disimpan & otomatis tampil di Kegiatan Warga!" };
        }

        // Logika Toggle Mode Pendaftar Baru vs Bayar Cicilan
        function toggleModeQurban() {
          let isBaru = document.getElementById('modeBaru').checked;
          let areaBaru = document.getElementById('area-pendaftar-baru');
          let areaCicil = document.getElementById('area-cicilan');
          let labelUang = document.getElementById('label-uang-diterima');

          document.getElementById('qrb_select_cicilan').required = !isBaru;
        
          if (isBaru) {
         areaBaru.classList.remove('d-none');
         areaCicil.classList.add('d-none');
         labelUang.innerText = 'Uang Diterima / DP (Rp)*';
         document.getElementById('qrb_nominal').value = '';

         areaBaru.classList.add('d-none');
         areaCicil.classList.remove('d-none');
         labelUang.innerText = 'Nominal Cicilan Saat Ini (Rp)*';
         document.getElementById('qrb_nominal').value = '';
         
         // Load Dropdown Orang yang Belum Lunas
         let sel = document.getElementById('qrb_select_cicilan');
         sel.innerHTML = '<option value="">-- Pilih Nama Pequrban --</option>';
         
         let adaCicilan = false;
         dataMasjidGlobal.qurban.forEach(d => {
            let harga = parseFloat(d.harga) || 0;
            let bayar = parseFloat(d.nominal) || 0;
            if (d.status !== 'Lunas' && (harga - bayar > 0)) {
               sel.innerHTML += `<option value="${d.id}">${d.nama} (${d.hewan})</option>`;
               adaCicilan = true;
            }
         });
         
         if(!adaCicilan) {

         }
         hitungSisaCicilan(); // Sembunyikan info box
          }

        // 2. Helper untuk konversi format tanggal "dd/MM/yyyy" dari data ke objek Date
        function parseLocalDate(dateStr) {
        if (!dateStr || typeof dateStr !== 'string' || !dateStr.includes('/')) return null;
        let parts = dateStr.split('/');
        if (parts.length !== 3) return null;
        return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        }
        
        // 3. Helper untuk konversi input "YYYY-MM-DD" ke objek Date
        function parseInputDate(dateStr) {
        if (!dateStr) return null;
        let parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }
        
        // 4. Eksekusi Filter & Cetak PDF Kas Warga
        function executeExportKasWargaPDF(tipeLaporan, tglMulaiStr, tglSelesaiStr) {
        let filterData = [];
        if (tipeLaporan === 'Umum') {
            filterData = dataKasGlobal.filter(k => k.kategori !== 'Jimpitan' && k.asalDana !== 'Jimpitan');
        } else {
            filterData = dataKasGlobal.filter(k => k.kategori === 'Jimpitan' || k.asalDana === 'Jimpitan');
        }
        
        let start = parseInputDate(tglMulaiStr);
        let end = parseInputDate(tglSelesaiStr);
        if (end) end.setHours(23, 59, 59, 999); // Mencakup hingga akhir hari tersebut
        
        let finalData = filterData.filter(k => {
            let tglTrx = parseLocalDate(k.tanggal);
            if (!tglTrx) return false;
            return tglTrx >= start && tglTrx <= end;
        });
        
        if (finalData.length === 0) {
            return Swal.fire('Data Kosong', `Tidak ada transaksi Kas ${tipeLaporan} pada rentang tanggal tersebut.`, 'warning');
        }
        
        let body = finalData.map((k, i) => [
           i + 1, k.tanggal, k.jenis, k.kategori, k.keterangan, 
           k.namaWarga !== '-' ? k.namaWarga : k.namaKK, 
           formatRupiah(k.nominal), k.status
        ]); 
        
        cetakPDF(`Laporan Kas Warga (${tipeLaporan}) [${tglMulaiStr} s/d ${tglSelesaiStr}]`, ['No', 'Tanggal', 'Jenis', 'Kategori', 'Keterangan', 'Warga/KK', 'Nominal', 'Status'], body); 
        }
        
        // 5. Eksekusi Filter & Cetak PDF Kas Masjid
        function executeExportKasMasjidPDF(tglMulaiStr, tglSelesaiStr) {
        let start = parseInputDate(tglMulaiStr);
        let end = parseInputDate(tglSelesaiStr);
        if (end) end.setHours(23, 59, 59, 999);
        
        let finalData = dataKasMasjidGlobal.filter(m => {
            let tglTrx = parseLocalDate(m.tanggal);
            if (!tglTrx) return false;
            return tglTrx >= start && tglTrx <= end;
        });
        
        if (finalData.length === 0) {
            return Swal.fire('Data Kosong', `Tidak ada transaksi Kas Masjid pada rentang tanggal tersebut.`, 'warning');
        }
        
        let body = finalData.map((m, i) => [
           i + 1, m.tanggal, m.jenis, m.kategori, 
           m.donatur !== '-' ? m.donatur : m.warga, 
           m.keterangan, formatRupiah(m.nominal), m.status
        ]); 
        
        cetakPDF(`Laporan Kas Masjid [${tglMulaiStr} s/d ${tglSelesaiStr}]`, ['No', 'Tanggal', 'Jenis', 'Kategori', 'Donatur/Warga', 'Keterangan', 'Nominal', 'Status'], body);
        }
        let dataKtAnggotaGlobal = [], dataKtKasGlobal = [], dataKtKegiatanGlobal = [], dataKtSuratGlobal = [], dataKtPengurusGlobal = [];
        
        
        function loadKtAnggotaData() {

        // 1. Ambil data seluruh warga untuk menghitung jumlah remaja secara otomatis

                // Hitung jumlah warga kategori remaja (Rentang usia 12 s/d 21 tahun)

                    let umur = new Date().getFullYear() - tahunLahir;
                    return umur >= 12 && umur <= 21; 
                }).length;
        
                // Tampilkan angka ke kotak total anggota di sebelah judul

    function submitKtKegiatan(e) {
      e.preventDefault();
      let btn = document.getElementById('btn-save-ktg');
      btn.disabled = true; 
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Menyimpan...';
      
      let p = {
        tanggal: document.getElementById('ktg_tgl').value,
        waktu: document.getElementById('ktg_jam').value,
        nama: document.getElementById('ktg_nama').value,
        lokasi: document.getElementById('ktg_lokasi').value,
        anggaran: document.getElementById('ktg_anggaran').value || 0
      };
    
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false; 
          btn.innerHTML = 'Simpan Agenda';
          if (res.success) {
            // Tutup modal
            let modalEl = document.getElementById('modalKtKegiatan');
            if (modalEl) {
              let modalObj = bootstrap.Modal.getInstance(modalEl) || bootstrap.Modal.getOrCreateInstance(modalEl);
              modalObj.hide();
            }
            
            Swal.fire({
              icon: 'success', 
              title: 'Berhasil!', 
              text: res.message,
              timer: 2000, 
              showConfirmButton: false
            });
    
            // 1. Refresh data internal Karang Taruna
            loadKtKegiatanData();
    
            // 2. Reset cache Kegiatan Utama agar selalu termuat data terbaru
            dataKegiatanGlobal = [];
    
            // 3. Refresh Portal Publik Warga secara instan
            if (typeof loadPublicData === 'function') {
              loadPublicData();
            }
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false; 
          btn.innerHTML = 'Simpan Agenda';
          Swal.fire('Error Koneksi', err.message || String(err), 'error');
        })
        .saveKtKegiatan(localStorage.getItem('sigas_token'), p);
    }

      Swal.fire({
        title: 'Hapus Agenda Karang Taruna?',
        text: 'Agenda ini juga akan otomatis terhapus dari Jadwal Kegiatan Warga & Dashboard Publik.',
        icon: 'warning',
        showCancelButton: true,

      }).then(r => {
        if (r.isConfirmed) {
          showLoading();
          google.script.run
            .withSuccessHandler(res => {
              hideLoading();
              if (res.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'Terhapus',
                  text: res.message,
                  timer: 1500,
                  showConfirmButton: false
                });
                
                // Refresh seluruh tabel terkait
                loadKtKegiatanData();
                dataKegiatanGlobal = [];
                if (typeof loadPublicData === 'function') {
                  loadPublicData();
                }
              } else {
                Swal.fire('Gagal', res.message, 'error');
              }
            })
            .withFailureHandler(err => {
              hideLoading();
              Swal.fire('Error Koneksi', String(err), 'error');
            })
            .deleteKtKegiatan(localStorage.getItem('sigas_token'), id);
        }
      });
    }

        function loadDataCctvSatpam() {
          const container = document.getElementById('container-grid-cctv-satpam');
          if (!container) return;
        
          // Mengambil data pengaturan yang sama persis dengan sistem CCTV Lingkungan
          google.script.run.withSuccessHandler(res => {
        let settings = {};
        if (res && res.success) {
          settings = res.data || {};
        } else {
          // Fallback ke localStorage jika gagal dari server
          try {
            settings = JSON.parse(localStorage.getItem('si_gas_settings') || '{}');
          } catch (e) {
            settings = {};
          }
        }
        
        let cctvList = [
          { nama: settings['cctv_1_nama'] || settings['set_cctv_1_nama'] || 'CCTV Titik 1 (Gerbang Utama)', url: settings['cctv_1_url'] || settings['set_cctv_1_url'] || '' },
          { nama: settings['cctv_2_nama'] || settings['set_cctv_2_nama'] || 'CCTV Titik 2 (Area Warga)', url: settings['cctv_2_url'] || settings['set_cctv_2_url'] || '' }
        ];
        
        container.innerHTML = '';
        let hasActiveCctv = false;
        
        cctvList.forEach((cam) => {
          if (cam.url && cam.url.trim() !== '') {
            hasActiveCctv = true;
            let trimmedUrl = cam.url.trim();
            
            // Render persis seperti CCTV Lingkungan
            let contentRender = trimmedUrl.startsWith('<iframe') 
              ? trimmedUrl.replace(/width="[^"]*"/gi, '').replace(/height="[^"]*"/gi, '').replace('<iframe', '<iframe class="w-100 h-100 rounded-3 border-0" allow="autoplay; fullscreen"') 
              : `<iframe src="${trimmedUrl}" class="w-100 h-100 rounded-3 border-0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        
            container.innerHTML += `
              <div class="col-lg-6 col-md-12 mb-3">
                <div class="card card-custom shadow-sm border-0 h-100">
                  <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">

                    <span class="badge bg-danger animate-pulse">● LIVE</span>
                  </div>
                  <div class="card-body p-2" style="height: 320px; background: #000; border-radius: 0 0 16px 16px;">
                    ${contentRender}
                  </div>
                </div>
              </div>`;
          }
        });
        
        if (!hasActiveCctv) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <div class="alert alert-warning d-inline-block p-4">
                <i class="fas fa-video-slash fa-2x mb-2 text-warning"></i>

              </div>
            </div>`;
        }
          }).getAppSettings();
        }

        // FITUR DRAGGABLE / GESER TOMBOL AI GEMINI
        // =====================================================
        document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('btn-ai-prompt');
        if (!btn) return;
        
        let isDragging = false;
        let startX, startY, initialX, initialY;
        let hasMoved = false;
        
        // Menggunakan Pointer Events agar support Mouse (Desktop) maupun Touch (HP)
        btn.addEventListener('pointerdown', (e) => {
            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = btn.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            
            // Ubah posisi dari bottom/right (fixed) menjadi left/top agar bisa digerakkan bebas
            btn.style.bottom = 'auto';
            btn.style.right = 'auto';
            btn.style.left = initialX + 'px';
            btn.style.top = initialY + 'px';
            
            btn.setPointerCapture(e.pointerId);
        });
        
        btn.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            // Jika digeser lebih dari 5 pixel, tandai sebagai pergerakan (bukan klik)
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }
            
            let newX = initialX + dx;
            let newY = initialY + dy;
            
            // Batasi agar tombol tidak keluar dari batas layar browser / HP
            const maxX = window.innerWidth - btn.offsetWidth;
            const maxY = window.innerHeight - btn.offsetHeight;
            
            newX = Math.max(10, Math.min(newX, maxX - 10));
            newY = Math.max(10, Math.min(newY, maxY - 10));
            
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
        });
        
        btn.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            try {
                btn.releasePointerCapture(e.pointerId);
            } catch(err) {}
        });
        
        // Mencegah fungsi 'openGeminiPrompt()' terpanggil jika tombolnya sedang diseret (drag)
        btn.addEventListener('click', (e) => {
            if (hasMoved) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
        });

        // Helper untuk menggelapkan warna sedikit untuk efek hover tombol
        function adjustColorBrightness(hex, percent) {
        let cleanHex = hex.replace('#','');
        if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(c => c + c).join('');
        }
        let num = parseInt(cleanHex, 16);
        if (isNaN(num)) return '#157347';
        let amt = Math.round(2.55 * percent);
        let R = (num >> 16) + amt;
        let G = (num >> 8 & 0x00FF) + amt;
        let B = (num & 0x0000FF) + amt;
        return '#' + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }
        
            
        // Helper untuk mengubah HEX ke RGB (untuk warna transparan alert)
        function hexToRgb(hex) {
        let cleanHex = hex.replace('#','');
        if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(c => c + c).join('');
        }
        let num = parseInt(cleanHex, 16);
        let r = (num >> 16) & 255;
        let g = (num >> 8) & 255;
        let b = num & 255;
        return `${r}, ${g}, ${b}`;
        }

        // GLOBAL GUARD: PENCEGAH KLIK GANDA (DOUBLE SUBMIT) UNTUK SEMUA FORM
        // =====================================================
        document.addEventListener('submit', function(e) {
        const form = e.target;
        // Cari tombol submit di dalam form yang sedang dikirim
        const submitBtn = form.querySelector('button[type="submit"], input[type="submit"]');
        
        if (submitBtn) {
            if (submitBtn.disabled) {
                // Jika tombol sudah dalam keadaan terkunci (artinya diklik 2x), batalkan submit susulan
                e.preventDefault();
                e.stopImmediatePropagation();
                return false;
            }
            
            // Kunci tombol seketika saat submit pertama kali berjalan
            submitBtn.disabled = true;
            
            // Simpan teks asli tombol jika belum pernah disimpan
            if (!submitBtn.hasAttribute('data-original-text')) {
                submitBtn.setAttribute('data-original-text', submitBtn.innerHTML || submitBtn.value);
            }
            
            // Ubah tampilan tombol menjadi status loading
            if (submitBtn.tagName === 'INPUT') {
                submitBtn.value = 'Menyimpan...';
            } else {
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Menyimpan...';

    let html5QrcodeScanner = null;
    
    function mulaiScanner() {
      const namaPetugas = document.getElementById('namaAbsen').value.trim();
      
      if (!namaPetugas) {
        tampilkanPesanAbsen("error", "Harap isi nama petugas terlebih dahulu!");
        return;
      }
    
      document.getElementById('reader').style.display = 'block';
      document.getElementById('btnMulaiScan').style.display = 'none';
      document.getElementById('btnTutupScan').style.display = 'block';
      document.getElementById('pesanAbsen').style.display = 'none';
    
      // Inisialisasi Scanner
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    
      html5QrcodeScanner.start(
        { facingMode: "environment" }, // Gunakan kamera belakang HP
        config,
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        tampilkanPesanAbsen("error", "Kamera tidak dapat diakses. Pastikan Anda memberi izin kamera.");
        tutupScanner();
      });
    }
    
    function onScanSuccess(decodedText, decodedResult) {
      // Hentikan scanner segera setelah berhasil scan untuk mencegah scan ganda
      tutupScanner();
      
      const namaPetugas = document.getElementById('namaAbsen').value;
      tampilkanPesanAbsen("info", "Memproses absensi, mohon tunggu...");
    
      // Kirim data scan ke Google Apps Script backend
      google.script.run
        .withSuccessHandler(function(response) {
          tampilkanPesanAbsen(response.status, response.pesan);
          if(response.status === "success") {
            document.getElementById('namaAbsen').value = ""; // Reset input
          }
        })
        .simpanAbsenRonda(namaPetugas, decodedText);
    }
    
    function onScanFailure(error) {
      // Abaikan error saat proses scanning (wajar terjadi saat mencari fokus kamera)
    }
    
    function tutupScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
          document.getElementById('btnMulaiScan').style.display = 'block';
          document.getElementById('btnTutupScan').style.display = 'none';
        }).catch(err => {
          console.log("Gagal menghentikan scanner: ", err);
        });
      }
    }
    
    function tampilkanPesanAbsen(status, pesan) {
      const alertBox = document.getElementById('pesanAbsen');
      alertBox.style.display = 'block';
      
      if (status === "success") {
        alertBox.className = "alert alert-success";
      } else if (status === "error") {
        alertBox.className = "alert alert-danger";
      } else {
        alertBox.className = "alert alert-info";
      }
      alertBox.innerHTML = pesan;
    }

      }).saveKoperasiPinjaman(localStorage.getItem('sigas_token'), p);
    }
    
    function promptBayarAngsuran(idPinjaman, namaAnggota, sisaTagihan) {
      Swal.fire({
        title: `Bayar Cicilan: ${namaAnggota}`,
        html: `
          <p class="small text-muted mb-2">Sisa Tagihan Saat Ini: <b>${formatRupiah(sisaTagihan)}</b></p>
          <input type="number" id="swal_nominal_cicilan" class="form-control text-center fw-bold text-success" placeholder="Masukkan Nominal Pembayaran" value="${sisaTagihan}">
        `,
        showCancelButton: true,
        confirmButtonColor: '#198754',
        confirmButtonText: 'Catat Pembayaran',
        cancelButtonText: 'Batal',
        preConfirm: () => {
          let val = document.getElementById('swal_nominal_cicilan').value;
          if (!val || parseFloat(val) <= 0) {
            Swal.showValidationMessage('Masukkan nominal pembayaran yang valid!');
          }
          return val;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          showLoading();
          google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res.success) {
              Swal.fire('Berhasil', res.message, 'success');
              loadKoperasiData();
            } else {
              Swal.fire('Gagal', res.message, 'error');
            }
          }).bayarAngsuranKoperasi(localStorage.getItem('sigas_token'), idPinjaman, result.value);
        }
      });
    }
    	
    function saveSettingBagian(e, settingsObj, formEl) {
      e.preventDefault();
      const submitBtn = formEl.querySelector('button[type="submit"]');
      if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';
      }
    
      google.script.run
    .withSuccessHandler(res => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Pengaturan';
      }
      if (res && res.success) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil',
          text: res.message || 'Pengaturan berhasil disimpan!',
          timer: 1500,
          showConfirmButton: false
        });
        Object.assign(appSettings, settingsObj);
      } else {
        Swal.fire('Gagal', res ? res.message : 'Terjadi kesalahan', 'error');
      }
    })
    .withFailureHandler(err => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Pengaturan';
      }
      Swal.fire('Error Koneksi', String(err), 'error');
    })
    .updateAppSettingsBulk(localStorage.getItem('sigas_token'), settingsObj);
    }
    
    function saveApiConfig(e) {
      e.preventDefault();
      const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
      
      const p = {
    'api_wa_url': getVal('api_wa_url'),
    'wa_group_jid': getVal('set_wa_group_jid'),
    'api_wa_token': getVal('api_wa_token'),
    'api_wa_url_fonnte': getVal('api_wa_url_fonnte')
      };
    
      const btnSave = document.getElementById('btn-save-api');
      if(btnSave){ 
    btnSave.disabled = true; 
    btnSave.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Menyimpan...'; 
      }
    
      google.script.run
    .withSuccessHandler(res => {
      if(btnSave){ 
        btnSave.disabled = false; 
        btnSave.innerHTML = '<i class="fas fa-save me-2"></i>Simpan Konfigurasi WA Gateway'; 
      }
      if(res.success) {
        Swal.fire('Berhasil', 'Konfigurasi WhatsApp Gateway telah diperbarui', 'success');
        Object.assign(appSettings, p); 
      } else {
        Swal.fire('Gagal', res.message, 'error');
      }
    })
    .updateAppSettingsBulk(localStorage.getItem('sigas_token'), p);
    }
    
    function hitungSimulasiPinjaman() {
      let nominal = parseFloat(document.getElementById('kop_pnj_nominal').value) || 0;
      let tenor = parseInt(document.getElementById('kop_pnj_tenor').value) || 1;
      let box = document.getElementById('box-simulasi-pinjaman');
      
      if (nominal <= 0) {
    if (box) box.style.display = 'none';
    return;
      }
      
      // Ambil pengaturan bunga dari variabel global appSettings
      let bungaTipe = appSettings['koperasi_bunga_tipe'] || 'Tanpa Bunga';
      let bungaPersen = parseFloat(appSettings['koperasi_bunga_persen']) || 0;
      
      let totalBunga = 0;
      let infoBungaTeks = `${bungaTipe} (${bungaPersen}%)`;
      
      if (bungaTipe !== 'Tanpa Bunga' && bungaPersen > 0) {
    if (bungaTipe === 'Bulanan') {
      totalBunga = nominal * (bungaPersen / 100) * tenor;
    } else if (bungaTipe === 'Tahunan') {
      let tahun = tenor / 12;
      totalBunga = nominal * (bungaPersen / 100) * tahun;
    } else {
      totalBunga = nominal * (bungaPersen / 100);
    }
      } else {
    infoBungaTeks = 'Tanpa Bunga (0%)';
      }
      
      let totalTagihan = Math.round(nominal + totalBunga);
      let cicilanPerBulan = Math.ceil(totalTagihan / tenor);
      
      // Tampilkan ke dalam kotak preview
      document.getElementById('sim_info_bunga').innerText = infoBungaTeks;
      document.getElementById('sim_total_tagihan').innerText = formatRupiah(totalTagihan);
      document.getElementById('sim_cicilan_bulan').innerText = formatRupiah(cicilanPerBulan);
      
      if (box) box.style.display = 'block';
    }
    
    // Pastikan simulasi direset saat modal dibuka
    function openModalKopPinjaman() {
      document.getElementById('formKopPinjaman').reset();
      document.getElementById('kop_pnj_tgl').valueAsDate = new Date();
      
      let box = document.getElementById('box-simulasi-pinjaman');
      if (box) box.style.display = 'none';
      
      let sa = document.getElementById('kop_pnj_anggota');
      sa.innerHTML = '<option value="">-- Pilih Anggota Koperasi --</option>';
      dataKoperasiGlobal.anggota.forEach(a => {
    sa.innerHTML += `<option value="${a.id}">${a.nama}</option>`;
      });
      
      new bootstrap.Modal(document.getElementById('modalKopPinjaman')).show();
    }
    
    function previewKajianGambar(input) {
      const file = input.files[0];
      if (file) {
    if (file.size > 2 * 1024 * 1024) {
      Swal.fire('Terlalu Besar!', 'Ukuran gambar maksimal 2MB.', 'warning');
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('kajian_img_preview').src = e.target.result;
      document.getElementById('box-preview-kajian').style.display = 'block';
      document.getElementById('kajian_gambar_url').value = e.target.result; // Base64 atau URL
    }
    reader.readAsDataURL(file);
      }
    }
  </script>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang - Portal Akses</title>
  
  <!-- Font Google Inter untuk tampilan tipografi modern dan bersih -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palet warna lembut dan menenangkan (kombinasi sage & pastel slate) */
      --bg-gradient-start: #f4f7f5;
      --bg-gradient-mid: #e9f0ec;
      --bg-gradient-end: #dfeae4;
      
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 45px -15px rgba(28, 54, 45, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.03);
      
      --text-main: #1f2937;
      --text-muted: #5f716a;
      
      --btn-bg: #2d5043;
      --btn-bg-hover: #223e34;
      --btn-text: #ffffff;
      --btn-shadow: 0 10px 22px -6px rgba(45, 80, 67, 0.35);
      --btn-shadow-hover: 0 14px 28px -6px rgba(45, 80, 67, 0.45);
      
      --toast-bg: #1f2d27;
      --toast-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Elemen latar belakang abstrak dengan gradasi halus */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
      pointer-events: none;
      opacity: 0.65;
    }

    .shape-1 {
      top: -10%;
      left: -8%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(195, 222, 209, 0.8) 0%, rgba(220, 238, 230, 0.2) 70%);
    }

    .shape-2 {
      bottom: -12%;
      right: -8%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(184, 212, 201, 0.75) 0%, rgba(206, 228, 220, 0.15) 70%);
    }

    .shape-3 {
      top: 55%;
      left: 12%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(230, 240, 235, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
    }

    /* Kartu utama dengan efek kaca lembut (glassmorphism halus) */
    .portal-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 52px 40px;
      text-align: center;
      box-shadow: var(--card-shadow);
      animation: gentleFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Ikon aksen minimalis di atas judul */
    .brand-glyph {
      width: 52px;
      height: 52px;
      margin: 0 auto 28px auto;
      border-radius: 16px;
      background: rgba(45, 80, 67, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--btn-bg);
      transition: transform 0.4s ease;
    }

    .brand-glyph:hover {
      transform: scale(1.04);
    }

    .brand-glyph svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.75;
    }

    /* Judul Utama */
    h1.title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    /* Deskripsi Singkat */
    p.subtitle {
      font-size: 0.975rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* Tombol Utama "Lanjutkan" */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 28px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--btn-text);
      background-color: var(--btn-bg);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      text-decoration: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action:hover {
      background-color: var(--btn-bg-hover);
      transform: translateY(-2px);
      box-shadow: var(--btn-shadow-hover);
    }

    .btn-action:active {
      transform: translateY(0) scale(0.985);
      box-shadow: var(--btn-shadow);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      transition: transform 0.28s ease;
      stroke-width: 2;
    }

    .btn-action:hover svg {
      transform: translateX(4px);
    }

    /* Komponen Notifikasi Toast Ramah (pengganti alert) */
    .custom-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--toast-bg);
      color: var(--toast-text);
      padding: 14px 22px;
      border-radius: 14px;
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      max-width: 90%;
      width: max-content;
      text-align: left;
    }

    .custom-toast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast-icon {
      color: #9fe2bf;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* Animasi Masuk */
    @keyframes gentleFadeIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Penyesuaian Responsif untuk Ponsel */
    @media (max-width: 480px) {
      .portal-card {
        padding: 42px 26px;
        border-radius: 22px;
      }

      h1.title {
        font-size: 1.75rem;
      }

      p.subtitle {
        font-size: 0.925rem;
        margin-bottom: 30px;
      }

      .btn-action {
        padding: 14px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Bentuk Dekoratif Abstrak di Latar Belakang -->
  <div class="bg-shape shape-1" aria-hidden="true"></div>
  <div class="bg-shape shape-2" aria-hidden="true"></div>
  <div class="bg-shape shape-3" aria-hidden="true"></div>

  <!-- Kartu Utama Portal -->
  <main class="portal-card">
    
    <!-- Ikon Simbol Akses Minimalis -->
    <div class="brand-glyph" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75A2.25 2.25 0 001.5 13.5v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    </div>

    <!-- Judul & Deskripsi Sesuai Ketentuan -->
    <h1 class="title">Selamat Datang</h1>
    <p class="subtitle">Silakan lanjutkan untuk mengakses portal.</p>

    <!-- Tombol Tunggal Utama -->
    <button type="button" class="btn-action" id="btnContinue" aria-label="Lanjutkan ke portal utama">
      <span>Lanjutkan</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    </button>
  </main>

  <!-- Komponen Notifikasi Ramah Saat URL Belum Ditetapkan -->
  <aside id="toastNotice" class="custom-toast" role="status" aria-live="polite">
    <span class="toast-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </span>
    <span id="toastMessage">Tautan portal tujuan belum diatur.</span>
  </aside>

  <script>
    /**
     * KONFIGURASI URL TUJUAN
     * Diarahkan ke file indexbase.html (aplikasi utama Anda)
     */
    const targetUrl = "indexbase.html";

    // Tombol dan Elemen Notifikasi
    const btnContinue = document.getElementById('btnContinue');
    const toastNotice = document.getElementById('toastNotice');
    const toastMessage = document.getElementById('toastMessage');
    let toastTimeout = null;

    /**
     * Fungsi untuk menampilkan pesan ramah kepada pengguna
     */
    function showNotification(message) {
      if (toastTimeout) {
        clearTimeout(toastTimeout);
      }

      toastMessage.textContent = message;
      toastNotice.classList.add('active');

      toastTimeout = setTimeout(() => {
        toastNotice.classList.remove('active');
      }, 3500);
    }

    /**
     * STREAMING_CHUNK:Menangani transisi klik menuju indexbase.html
     * Handler saat tombol "Lanjutkan" diklik dengan animasi pemuatan
     */
    btnContinue.addEventListener('click', function() {
      const sanitizedUrl = typeof targetUrl === 'string' ? targetUrl.trim() : "";

      if (!sanitizedUrl || sanitizedUrl === "#") {
        showNotification("Alamat portal tujuan belum ditentukan.");
        return;
      }

      // Berikan efek transisi tombol saat ditekan
      btnContinue.style.pointerEvents = "none";
      btnContinue.style.opacity = "0.75";
      btnContinue.innerHTML = `
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin 0.75s linear infinite;"></span>
        <span>Membuka Portal...</span>
      `;

      // Arahkan ke file aplikasi utama (indexbase.html)
      setTimeout(() => {
        window.location.href = sanitizedUrl;
      }, 350);
    });
  </script>
</body>
</html>
